meta:
  name: sarif-spec-rules
  description: >-
    SARIF Version 2.2 specification-level quality rules.
    Extends the shared OASIS baseline (oasis.rules.yaml) and adds SARIF-specific checks.
    Run with: nide quality --rules etc/rules/spec.rules.yaml
  extends: oasis

context:
  tc-name: sarif
  spec-name: sarif
  spec-version: "2.2"
  stage: csd01
  doc-url-base: https://docs.oasis-open.org/sarif/sarif/v2.2

rules:

  # ── SARIF spec-specific checks ─────────────────────────────────────────────

  - id: SARIF-TITLE
    severity: BLOCKER
    description: The document title must identify the spec by name
    check:
      type: section-present
      pattern: 'Static Analysis Results Interchange Format|SARIF'
      flags: IGNORECASE

  - id: SARIF-STAGE-HEADING
    severity: WARN
    description: >-
      A publication-stage heading (Committee Specification Draft, Committee
      Specification, etc.) must appear in the front matter
    check:
      type: section-present
      pattern: 'Committee Specification Draft|Committee Specification|Candidate OASIS Standard|OASIS Standard'
      flags: IGNORECASE

  - id: SARIF-THIS-VERSION
    severity: BLOCKER
    description: A 'This version' heading must be present in the front matter
    check:
      type: section-present
      pattern: 'This version'
      flags: IGNORECASE

  - id: SARIF-LATEST-VERSION
    severity: WARN
    description: A 'Latest version' heading must be present in the front matter
    check:
      type: section-present
      pattern: 'Latest version'
      flags: IGNORECASE

  - id: SARIF-TC-LINK
    severity: WARN
    description: A link to the SARIF TC community page should appear in the front matter
    check:
      type: any-match
      target: prose
      pattern: 'oasis-open\.org.*sarif|groups\.oasis-open\.org.*communities'
      flags: IGNORECASE

  - id: SARIF-DOC-URL
    severity: WARN
    description: >-
      At least one this-version URL under docs.oasis-open.org/sarif
      must appear in the front matter
    check:
      type: any-match
      target: prose
      pattern: 'docs\.oasis-open\.org/sarif'
      flags: IGNORECASE

  - id: SARIF-SAFETY-SECURITY
    severity: WARN
    description: >-
      A Safety, Security and Data Protection section must be present
      (OASIS best practice for all Standards Track Work Products)
    check:
      type: section-present
      pattern: 'Safety.*Security|Security.*Safety'
      flags: IGNORECASE

  - id: SARIF-REFERENCES-ANNEX
    severity: BLOCKER
    description: >-
      A top-level References section must be present.
      Match the base heading text only (annex counter is not part of HeadingNode.text).
    check:
      type: section-present
      pattern: '^References$'
      flags: IGNORECASE

  - id: SARIF-NORMATIVE-REFS
    severity: BLOCKER
    description: A Normative references subsection must be present
    check:
      type: section-present
      pattern: 'Normative [Rr]eferences'
      flags: IGNORECASE

  - id: SARIF-INFORMATIVE-REFS
    severity: WARN
    description: An Informative references subsection should be present
    check:
      type: section-present
      pattern: 'Informative [Rr]eferences'
      flags: IGNORECASE

  - id: SARIF-LICENSE-ANNEX
    severity: BLOCKER
    description: >-
      A License, Document Status and Notices annex must be present
      (mandatory OASIS content)
    check:
      type: section-present
      pattern: 'License.*Notices|Notices.*License|Document Status'
      flags: IGNORECASE

  - id: SARIF-ACKNOWLEDGMENTS
    severity: WARN
    description: An Acknowledgments appendix should be present
    check:
      type: section-present
      pattern: '^Acknowledgments?$'
      flags: IGNORECASE

  - id: SARIF-CHANGES-APPENDIX
    severity: WARN
    description: A Changes From Previous Version appendix should be present
    check:
      type: section-present
      pattern: 'Changes From Previous Version|Revision History'
      flags: IGNORECASE

  - id: SARIF-KEY-WORDS-SECTION
    severity: WARN
    description: >-
      A Key Words subsection under Document Conventions must be present
      (standard location for RFC 2119 boilerplate)
    check:
      type: section-present
      pattern: 'Key Words|Terminology'
      flags: IGNORECASE

  - id: SARIF-DEFINITIONS-SECTION
    severity: WARN
    description: A Definitions and Abbreviations section (or equivalent) must be present
    check:
      type: section-present
      pattern: 'Definitions|Terms and Definitions'
      flags: IGNORECASE

  # ── Headings as keys into the schema (A3 against A1) ──────────────────────

  - id: SARIF-SCHEMA-HEADINGS
    severity: BLOCKER
    description: >-
      Object and property headings name the schema: every `` `x` Object `` section has a definition, every
      `` `p` Property `` section a property of it, every property of a headed object a section or a mention,
      and a heading that seems to name a property gives it as `` `name` Property `` (four did not, 2026-11)
    check:
      type: schema-headings
      schema: ../../schema/sarif.json
      object-heading: '^`(?P<object>\w+)` Object$'
      property-heading: '^(?P<property>(?:`\$?\w+`(?:, and |, | and )?)+) Propert(?:y|ies)$'
      looks-like: '^(?:.*`.*|\$?\w+) [Pp]ropert(?:y|ies)$'
      root: sarifLog
      schema-only: true
      ignore: [properties]
      described-in:
        externalProperties: externalPropertyFileReferences  # the externalized properties: a table there
      known:  # differences waiting for the TC (the ids of assessment/README.md)
        - kind: prose-only
          key: suppression.justificationType
          reason: 'S1: prose added by #672 (issue 574); the schema never followed'
        - kind: prose-only
          key: attachment.location
          reason: 'S3: the schema calls it artifactLocation; the attachment example uses location and fails'
        - kind: prose-only
          key: externalProperties.$schema
          reason: 'S4: the schema calls it schema, while sarifLog uses $schema'
        - kind: schema-only
          key: externalProperties.schema
          reason: 'S4: the other side'

  # ── Example twins (A4 against A1) ─────────────────────────────────────────

  - id: SARIF-TWINS
    severity: BLOCKER
    description: >-
      Every JSON code block keyed by a twin is derived from it (nide derive), every twin has a record and a block,
      its markers are well-formed, its margin notes resolve to sections, and it is valid as its host definition
      once the context its display leaves out is injected
    check:
      type: twins
      known:  # twins that contradict the schema: decisions for the TC
        - kind: content
          key: external-property-file-format_externalproperties-object_general_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-03-artifactcontent-object_rendered-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-11-message-object_messages-with-embedded-links_example-2.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-14-run-object_redactiontokens-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-19-toolcomponent-object_notifications-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-20-invocation-object_toolconfigurationnotifications-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-21-attachment-object_general_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-22-conversion-object_general_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-27-result-object_kind-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-27-result-object_level-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-27-result-object_relatedlocations-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-43-edgetraversal-object_stepoveredgecount-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-50-reportingconfiguration-object_parameters-property_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
        - kind: content
          key: file-format-57-replacement-object_general_example-1.json
          reason: 'TC: contradicts the schema in prose and twin alike (views/findings.md)'
